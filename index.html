<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeCheck 🌀 AI Roast & Boost</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #fad0c4 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        .retro-bg-circles div {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            animation: float 10s infinite alternate ease-in-out;
            z-index: 0;
        }
        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-40px) scale(1.1); }
        }
    </style>
</head>
<body class="py-10 px-4 font-sans text-gray-800 flex flex-col items-center justify-center">

    <div class="retro-bg-circles absolute inset-0 pointer-events-none overflow-hidden">
        <div style="top: 10%; left: 5%; width: 120px; height: 120px; background: rgba(255, 230, 109, 0.4);"></div>
        <div style="top: 60%; right: 10%; width: 200px; height: 200px; background: rgba(255, 111, 97, 0.3);"></div>
        <div style="bottom: 5%; left: 15%; width: 160px; height: 160px; background: rgba(132, 250, 176, 0.3);"></div>
    </div>

    <div class="relative z-10 w-full max-w-lg bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl p-6 md:p-8 border-4 border-yellow-300">
        
        <div class="text-center mb-6">
            <span class="bg-yellow-300 text-yellow-900 text-xs font-bold uppercase px-3 py-1 rounded-full tracking-wide">Retro Vibe Studio</span>
            <h1 class="text-3xl md:text-4xl font-black text-indigo-900 mt-2">VIBECHECK 🌀</h1>
            <p class="text-sm text-gray-600 mt-1">Lass dir von der KI deine echten Vibes spiegeln – mit einer Prise Humor.</p>
        </div>

        <form id="vibeForm" class="space-y-5">
            
            <div>
                <label class="block text-sm font-bold text-indigo-900 mb-1">1. Dein Vorname</label>
                <input type="text" id="vorname" required placeholder="z.B. Alex" class="w-full px-4 py-2 rounded-xl border-2 border-indigo-100 focus:border-indigo-500 focus:outline-none bg-indigo-50/30">
            </div>

            <div>
                <label class="block text-sm font-bold text-indigo-900 mb-1">2. Dein Sternzeichen</label>
                <div class="flex overflow-x-auto space-x-2 pb-2 scrollbar-thin">
                    <label class="cursor-pointer shrink-0">
                        <input type="radio" name="sternzeichen" value="Widder" class="peer hidden" checked>
                        <div class="px-3 py-2 rounded-xl border-2 border-indigo-100 peer-checked:bg-indigo-600 peer-checked:text-white text-xs font-semibold bg-white text-center">♈ Widder</div>
                    </label>
                    <label class="cursor-pointer shrink-0">
                        <input type="radio" name="sternzeichen" value="Stier" class="peer hidden">
                        <div class="px-3 py-2 rounded-xl border-2 border-indigo-100 peer-checked:bg-indigo-600 peer-checked:text-white text-xs font-semibold bg-white text-center">♉ Stier</div>
                    </label>
                    <label class="cursor-pointer shrink-0">
                        <input type="radio" name="sternzeichen" value="Zwillinge" class="peer hidden">
                        <div class="px-3 py-2 rounded-xl border-2 border-indigo-100 peer-checked:bg-indigo-600 peer-checked:text-white text-xs font-semibold bg-white text-center">♊ Zwillinge</div>
                    </label>
                    <label class="cursor-pointer shrink-0">
                        <input type="radio" name="sternzeichen" value="Krebs" class="peer hidden">
